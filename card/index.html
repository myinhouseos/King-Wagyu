<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deja Nienaber | King Wagyu</title>

<meta property="og:type" content="website">
<meta property="og:title" content="Deja Nienaber | King Wagyu">
<meta property="og:description" content="Top genetics in Namibia. Save contact, call, email, find the farm.">

<link rel="apple-touch-icon" href="assets/contact-photo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000;
    --gold:#B89A5A;
    --off-white:#F7F6F2;
    --stone:#D9D1C7;
    --wine:#4A1018;
    --line:rgba(247,246,242,.16);
    --font-display:'Cormorant Garamond',Georgia,serif;
    --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--black);-webkit-text-size-adjust:100%}
  body{
    background:var(--black);color:var(--off-white);
    font-family:var(--font-body);font-size:16px;line-height:1.5;
    min-height:100svh;display:flex;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:480px;background:var(--black);
    display:flex;flex-direction:column;
    border-left:1px solid transparent;border-right:1px solid transparent;
  }
  @media (min-width:520px){ .card{border-color:var(--line)} }

  .art{display:block;width:100%;height:auto}
  .art-top{margin-bottom:-1px}
  .art-bottom{margin-top:auto}

  .body{padding:8px 24px 40px}
  .name{
    font-family:var(--font-display);font-weight:600;
    font-size:clamp(2.1rem,9vw,2.6rem);line-height:1.05;letter-spacing:.01em;
    text-align:center;
  }
  .org{
    margin-top:10px;text-align:center;
    font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);
  }

  .save{
    display:flex;align-items:center;justify-content:center;gap:12px;
    margin:28px 0 22px;min-height:58px;padding:0 24px;
    background:var(--gold);color:#050505;text-decoration:none;
    font-weight:500;font-size:.82rem;letter-spacing:.24em;text-transform:uppercase;
    border:1px solid var(--gold);
    -webkit-tap-highlight-color:transparent;
  }
  .save:active{background:#a38748}
  .save svg{width:20px;height:20px;flex:none}
  .save:focus-visible,.row:focus-visible{outline:2px solid var(--off-white);outline-offset:3px}

  .rows{list-style:none;border-top:1px solid var(--line)}
  .row{
    display:flex;align-items:center;gap:16px;
    min-height:68px;padding:12px 2px;
    border-bottom:1px solid var(--line);
    color:var(--off-white);text-decoration:none;
    -webkit-tap-highlight-color:transparent;
  }
  .row:active{background:rgba(74,16,24,.45)}
  .ico{
    flex:none;width:42px;height:42px;display:grid;place-items:center;
    border:1px solid rgba(184,154,90,.55);color:var(--gold);
  }
  .ico svg{width:19px;height:19px}
  .txt{flex:1;min-width:0}
  .lbl{
    display:block;font-size:.64rem;letter-spacing:.26em;text-transform:uppercase;
    color:var(--stone);opacity:.7;
  }
  .val{display:block;margin-top:2px;font-size:1rem;overflow-wrap:anywhere}
  .go{flex:none;width:16px;height:16px;color:var(--gold);opacity:.8}

  .note{
    margin-top:18px;text-align:center;font-size:.72rem;color:var(--stone);opacity:.6;letter-spacing:.04em;
  }
  .foot{padding:0 24px 18px;text-align:center}
  .tag{
    font-size:.64rem;letter-spacing:.34em;text-transform:uppercase;color:var(--stone);opacity:.75;
    margin:6px 0 0;
  }
  .art-bottom{padding-bottom:env(safe-area-inset-bottom)}
</style>
</head>
<body>
<main class="card">

  <img class="art art-top" src="assets/header.jpg" width="1080" height="620" alt="King Wagyu. The proof is in our beef. Top genetics in Namibia.">

        <span class="txt"><span class="lbl">Email</span><span class="val">deja@kingwagyu.net</span></span>
        <svg class="go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>

      <li><a class="row" href="https://maps.app.goo.gl/dxrkBtCHCgoueUo48" target="_blank" rel="noopener">

        <span class="txt"><span class="lbl">Location</span><span class="val">Farm Houmoed, Hochfeld, Namibia</span></span>

      </a></li>

      <li><a class="row" href="https://www.facebook.com/kingwagyu/" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M14 8.5h2.5V5H14a3.5 3.5 0 0 0-3.5 3.5V11H8v3.5h2.5V21H14v-6.5h2.5L17 11h-3V8.9c0-.2.1-.4.4-.4z"/></svg></span>
        <span class="txt"><span class="lbl">Facebook</span><span class="val">King Wagyu</span></span>
        <svg class="go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
      </a></li>

      <li><a class="row" href="https://www.instagram.com/kingwagyunamibia/" target="_blank" rel="noopener">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".9" fill="currentColor" stroke="none"/></svg></span>
        <span class="txt"><span class="lbl">Instagram</span><span class="val">@kingwagyunamibia</span></span>
        <svg class="go" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
      </a></li>
    </ul>

    <p class="note">Save contact opens in your phone's Contacts.</p>
  </section>

  <img class="art art-bottom" src="assets/footer.jpg" width="1080" height="740" alt="" loading="lazy">

</main>
</body>
</html>
